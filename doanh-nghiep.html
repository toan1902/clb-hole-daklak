<style>
:root{--red:#B71C1C;--red-dark:#7B1212;--gold:#C9960C;--gold-light:#F5D060;--cream:#FDF6E3;--warm-gray:#5D4037;--text:#2C1A0E;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--cream);color:var(--text);line-height:1.8;}
nav{background:var(--red);padding:16px 24px;}
nav a{color:#fff;text-decoration:none;font-weight:600;font-size:15px;}
nav a:hover{text-decoration:underline;}
.banner{font-size:64px;text-align:center;background:linear-gradient(135deg,var(--gold-light),var(--gold));padding:48px 24px;}
.wrap{max-width:760px;margin:0 auto;padding:40px 24px 80px;}
.tag{display:inline-block;background:var(--red);color:#fff;font-size:12px;font-weight:700;letter-spacing:1px;padding:6px 14px;border-radius:20px;text-transform:uppercase;margin-bottom:16px;}
h1{font-family:'Playfair Display',serif;font-size:30px;font-weight:900;color:var(--red-dark);margin-bottom:12px;line-height:1.3;}
.date{color:var(--warm-gray);font-size:14px;margin-bottom:32px;}
.article p{margin-bottom:20px;font-size:17px;text-align:justify;}
.article h2{font-family:'Playfair Display',serif;font-size:22px;color:var(--red-dark);margin:32px 0 14px;}
.article figure{margin:28px 0;}
.article img{width:100%;border-radius:10px;display:block;box-shadow:0 4px 16px rgba(0,0,0,.15);}
.article figcaption{font-size:13px;color:var(--warm-gray);text-align:center;margin-top:8px;font-style:italic;}
.byline{margin-top:40px;padding-top:20px;border-top:1px solid #e0d0b0;font-style:italic;color:var(--warm-gray);font-size:14px;}
.back{display:inline-block;margin-top:24px;color:var(--red);text-decoration:none;font-weight:600;}
.back:hover{text-decoration:underline;}
</style>
</head>
