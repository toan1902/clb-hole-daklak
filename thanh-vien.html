<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="pageTitle">Tin tuc - CLB Doanh Nhan Ho Le Dak Lak</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--red:#B71C1C;--red-dark:#7B1212;--gold:#C9960C;--gold-light:#F5D060;--cream:#FDF6E3;--warm-gray:#5D4037;--text:#2C1A0E;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--cream);color:var(--text);line-height:1.8;}
nav{background:var(--red);padding:16px 24px;}
nav a{color:#fff;text-decoration:none;font-weight:600;font-size:15px;}
nav a:hover{text-decoration:underline;}
.banner{font-size:64px;text-align:center;background:linear-gradient(135deg,var(--gold-light),var(--gold));padding:48px 24px;}
.wrap{max-width:760px;margin:0 auto;padding:40px 24px 80px;}
.tag{display:inline-block;background:var(--red);color:#fff;font-size:12px;font-weight:700;letter-spacing:1px;padding:6px 14px;border-radius:20px;text-transform:uppercase;margin-bottom:16px;}
h1{font-family:'Playfair Display',serif;font-size:30px;font-weight:900;color:var(--red-dark);margin-bottom:12px;line-height:1.3;}
.date{color:var(--warm-gray);font-size:14px;margin-bottom:32px;}
.article p{margin-bottom:20px;font-size:17px;text-align:justify;}
.article h2{font-family:'Playfair Display',serif;font-size:22px;color:var(--red-dark);margin:32px 0 14px;}
.article figure{margin:28px 0;}
.article img{width:100%;border-radius:10px;display:block;box-shadow:0 4px 16px rgba(0,0,0,.15);}
.article figcaption{font-size:13px;color:var(--warm-gray);text-align:center;margin-top:8px;font-style:italic;}
.byline{margin-top:40px;padding-top:20px;border-top:1px solid #e0d0b0;font-style:italic;color:var(--warm-gray);font-size:14px;}
.back{display:inline-block;margin-top:24px;color:var(--red);text-decoration:none;font-weight:600;}
.back:hover{text-decoration:underline;}
.biz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;margin-top:20px;}
.biz-card{display:flex;flex-direction:column;background:#fff;border-radius:10px;padding:18px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.08);text-decoration:none;color:inherit;transition:transform .15s;}
.biz-card:hover{transform:translateY(-4px);}
.biz-thumb{width:72px;height:72px;border-radius:50%;margin:0 auto 12px;background:linear-gradient(135deg,var(--gold-light),var(--gold));display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;}
.biz-thumb img{width:100%;height:100%;object-fit:cover;}
.biz-info h3{font-family:'Playfair Display',serif;font-size:16px;color:var(--red-dark);margin-bottom:6px;line-height:1.3;}
.biz-sector{display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:2px 10px;border-radius:10px;margin-bottom:8px;}
.biz-excerpt{font-size:13px;color:var(--warm-gray);line-height:1.6;margin-bottom:10px;}
.biz-link{font-size:13px;font-weight:700;color:var(--red);margin-top:auto;}
</style>
</head>
<body>
<nav><a href="index.html#lanhDao">&larr; CLB Doanh nhân Họ Lê Đắk Lắk</a></nav>
<div class="banner" id="banner"></div>
<div class="wrap">
<div class="tag" id="tag"></div>
<h1 id="title"></h1>
<div class="date" id="date"></div>
<div class="article" id="content"></div>
<div class="byline">Hồ sơ thành viên · CLB Doanh nhân Họ Lê Đắk Lắk</div>
<a class="back" href="index.html#lanhDao">&larr; Danh sách thành viên</a>
</div>
<script src="/stc-config.js?v=4"></script><script src="/assets/cms-common.js?v=4"></script><script src="/assets/public-cms.js?v=4"></script>
</body>
</html>
